global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: phntm_bridge_ui
    scheme: https
    tls_config:
      insecure_skip_verify: true   # self-signed cert
    static_configs:
      - targets:
          # host.docker.internal resolves to the Docker host via extra_hosts in compose
          - "host.docker.internal:8443"
        labels:
          instance: phntm_bridge_ui
